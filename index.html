<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <title>ФРУКТОВЫЙ НИНДЗЯ</title>
  <style>
    html, body {
      margin: 0; padding: 0;
      width: 100%; height: 100%;
      overflow: hidden;
      background: #1a0a2e;
      touch-action: none;
      -webkit-user-select: none;
      user-select: none;
    }
    canvas { display: block; touch-action: none; }
  </style>
</head>
<body>
  <script>
    window.onerror = function (msg) {
      var d = document.createElement("div");
      d.style.cssText = "color:#ff6b6b;font:14px monospace;position:fixed;bottom:0;left:0;background:rgba(0,0,0,0.7);padding:10px;z-index:9999;max-width:100%;white-space:pre-wrap";
      d.textContent = "Ошибка: " + msg;
      document.body.appendChild(d);
    };
    (function () {
      var sources = [
        "https://cdn.jsdelivr.net/npm/p5@1.9.4/lib/p5.min.js",
        "https://unpkg.com/p5@1.9.4/lib/p5.min.js",
        "https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.9.4/p5.min.js"
      ];
      var i = 0;
      function tryNext() {
        if (i >= sources.length) {
          document.body.insertAdjacentHTML("beforeend",
            "<div style='color:#fff;font:16px sans-serif;padding:20px'>Не удалось загрузить p5.js. Проверь интернет и обнови страницу.</div>");
          return;
        }
        var s = document.createElement("script");
        s.src = sources[i++];
        s.onload = function () {
          var g = document.createElement("script");
          g.src = "sketch.js";
          document.body.appendChild(g);
        };
        s.onerror = tryNext;
        document.head.appendChild(s);
      }
      tryNext();
    })();
  </script>
</body>
</html>
